name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v3

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase local env
        shell: bash
        run: |
          supabase status -o env > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          source supabase.env
          echo "SUPABASE_URL=${SUPABASE_URL:-${API_URL}}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${ANON_KEY}}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY}}" >> "$GITHUB_ENV"

      - name: Reset database and apply migrations
        run: supabase db reset

      - name: Create PR36 fixtures
        run: bun scripts/qa/setup-pr36-fixtures.ts

      - name: Validate PR33/PR36 guardian isolation
        run: bun scripts/qa/pr33-real-isolation.ts

      - name: Validate atomic supersede RPC concurrency and normalization
        run: bun scripts/qa/pr36-supersede-concurrency.ts

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
