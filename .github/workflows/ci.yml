name: CI

on:
  push:
    branches: [main, fix/finalize-kuan-v1]
  pull_request:

permissions:
  contents: read

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase local env
        shell: bash
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            > supabase.env
          grep '^SUPABASE_' supabase.env >> "$GITHUB_ENV"

      - name: Reset database and apply migrations
        run: supabase db reset

      - name: Audit Kuan v1 functions and grants
        run: scripts/qa/kuan-v1-database-audit.sh

      - name: Create Kuan v1 fixtures
        run: bun scripts/qa/setup-pr36-fixtures.ts

      - name: Validate guardian A/B isolation
        run: bun scripts/qa/pr33-real-isolation.ts

      - name: Validate database grants, RPC, concurrency and normalization
        run: bun scripts/qa/pr36-supersede-concurrency.ts

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
