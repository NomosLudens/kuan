name: CI

on:
  push:
    branches: [main, fix/finalize-kuan-v1]
  pull_request:

permissions:
  contents: read

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start Supabase local stack
        run: supabase start

      - name: Export Supabase local env
        shell: bash
        run: |
          set -euo pipefail

          supabase status -o env > supabase.env
          source supabase.env

          : "${API_URL:?Missing API_URL from supabase status}"
          : "${ANON_KEY:?Missing ANON_KEY from supabase status}"
          : "${SERVICE_ROLE_KEY:?Missing SERVICE_ROLE_KEY from supabase status}"
          : "${DB_URL:?Missing DB_URL from supabase status}"

          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Reset database and apply migrations
        run: supabase db reset

      - name: Verify Supabase database connection
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Missing SUPABASE_DB_URL}"
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -Atc "select current_database(), current_user;"

      - name: Audit Kuan v1 functions and grants
        run: scripts/qa/kuan-v1-database-audit.sh

      - name: Create Kuan v1 fixtures
        run: bun scripts/qa/setup-pr36-fixtures.ts

      - name: Validate guardian A/B isolation
        run: bun scripts/qa/pr33-real-isolation.ts

      - name: Validate database grants, RPC, concurrency and normalization
        run: bun scripts/qa/pr36-supersede-concurrency.ts

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
